    <main>
      <div class="container">
        <div class="main-container">
          <br />
          <h1>WELCOME</h1>
          <br />
        </div>
        <div class="contact-container container">
          <div class="contact-info">
            <h2 class="contact-title">Contact Us</h2>
            <div class="form-container">
              <form action="">
                <div class="name-row">
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="First name"
                  /><label for="firstName"></label>
                  <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                    name="lastName"
                  /><label for="lastName"></label>
                </div>
                <div class="info-row">
                  <input
                    type="tel"
                    id="phone"
                    placeholder="Phone"
                    name="phone"
                  /><label for="phone"></label>
                  <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    name="email"
                    required
                  /><label for="email"></label>
                </div>
                <div class="reason-row">
                  <textarea
                    name="contactReason"
                    id="contactReason"
                    rows="15"
                    cols="53"
                    placeholder="Type your reason for contacting us today..."
                  ></textarea>
                </div>
                <input type="submit" id="submit" />
                <label for="submit" name="submit"></label>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
